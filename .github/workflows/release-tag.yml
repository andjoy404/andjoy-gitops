name: Version tag release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag format
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z-]+)?$ ]]; then
            echo "::error::Tag '${TAG}' does not match vMAJOR.MINOR.PATCH format."
            echo "::error::Example: v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/andjoy404/anjoy-gitops
          tags: |
            type=raw,value=${{ steps.tag.outputs.version }}
            type=raw,value=${{ steps.tag.outputs.version }}-{{sha}}
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.version }}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            DOCKER_BUILDKIT=1

      - name: Generate release notes
        id: notes
        run: |
          echo "---" > /tmp/release-notes.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.tag.outputs.tag }}...HEAD" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          # Use git log for this tag
          git log --oneline ${TAG} --no-merges --first-parent > /tmp/commits.txt
          if [ -s /tmp/commits.txt ]; then
            echo "**What's Changed**" >> /tmp/release-notes.md
            echo "" >> /tmp/release-notes.md
            while IFS= read -r line; do
              # Try to extract PR number from commit message
              if [[ "$line" =~ ^([a-f0-9]+)\ (.+)\ #([0-9]+)$ ]]; then
                COMMIT="${BASH_REMATCH[1]}"
                MSG="${BASH_REMATCH[2]}"
                PR="${BASH_REMATCH[3]}"
                echo "- ${MSG} ([#${PR}](https://github.com/${{ github.repository }}/pull/${PR}))" >> /tmp/release-notes.md
              else
                echo "- ${line}" >> /tmp/release-notes.md
              fi
            done < /tmp/commits.txt
          fi
          cp /tmp/release-notes.md /tmp/release-notes-final.md
          echo "DONE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "AndJoy GitOps ${{ steps.tag.outputs.tag }}"
          body_path: /tmp/release-notes-final.md
          generate_release_notes: true
          draft: false
